<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daybook</title>
<meta name="description" content="A private daily spending and budget tracker in EGP. Works offline; your data stays on your device.">
<meta name="theme-color" content="#EEF2F3">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Daybook">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app"><main id="view" tabindex="-1"></main></div>

<nav id="nav" aria-label="Main">
  <div class="inner">
    <button data-tab="today"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>Today</button>
    <button data-tab="history"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 6h14M5 12h14M5 18h9"/></svg>History</button>
    <button data-tab="budget"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8.5A2.5 2.5 0 0 1 6.5 6H18a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H6.5A2.5 2.5 0 0 1 4 17.5z"/><path d="M4 8.5V7.5A2.5 2.5 0 0 1 6.5 5H16M16 13.5h.01"/></svg>Budget</button>
    <button data-tab="insights"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V11M12 20V5M19 20v-6"/></svg>Insights</button>
    <button data-tab="more"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/></svg>More</button>
  </div>
</nav>

<button id="fab" data-act="add" aria-label="Add an entry"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>

<dialog id="sheet" aria-labelledby="sheet-title"></dialog>
<div id="toast" role="status" aria-live="polite"></div>
<div id="tip" role="tooltip" hidden></div>
<noscript><p style="padding:24px;font:16px system-ui">Daybook needs JavaScript to run.</p></noscript>

<script src="logic.js"></script>
<script src="app.js"></script>
</body>
</html>
